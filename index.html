<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記得啦</title>
<meta name="description" content="訂閱、帳單、保固、證件、稅費——所有會到期、會扣款的事，一個 App 記得。">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0e17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記得啦">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6H21M8.5 12H21M8.5 18H21M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.4"/><circle cx="9" cy="12" r="2.4"/><circle cx="17" cy="18" r="2.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.3l6.1-.7z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.6 7.5 9 4.3-1.4 7.5-4.5 7.5-9V6z"/><path d="m9 12 2.2 2.2L15 10"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-2.5-1.6L13 21l-2.5-1.6L8 21l-2-1.3z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5.5-5 4 3.5 3-2.5L21 18"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span data-i18n="app"></span></div>
    <button class="chip-btn" id="acctChip" type="button"></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="addBtn" type="button"><svg class="i"><use href="#i-plus"/></svg></button>

  <nav class="tabs">
    <button data-tab="home" type="button"><svg class="i"><use href="#i-home"/></svg><span data-i18n="tab.home"></span></button>
    <button data-tab="all" type="button"><svg class="i"><use href="#i-list"/></svg><span data-i18n="tab.all"></span></button>
    <button data-tab="stats" type="button"><svg class="i"><use href="#i-chart"/></svg><span data-i18n="tab.stats"></span></button>
    <button data-tab="settings" type="button"><svg class="i"><use href="#i-settings"/></svg><span data-i18n="tab.settings"></span></button>
  </nav>
</div>

<dialog id="sheet" class="sheet">
  <form id="itemForm" method="dialog" novalidate>
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="x" id="sheetClose"><svg class="i"><use href="#i-x"/></svg></button>
    </div>

    <button type="button" class="scan-cta" id="scanCta"><span class="st"><svg class="i"><use href="#i-receipt"/></svg></span><span><b data-i18n="scan.cta"></b><small data-i18n="scan.ctaSub"></small></span><svg class="i"><use href="#i-chev"/></svg></button>

    <div class="seg" id="typeSeg" role="radiogroup"></div>
    <div class="chips" id="tplChips"></div>

    <label class="f"><span data-i18n="form.name"></span>
      <input id="fName" required maxlength="40" autocomplete="off" data-i18n-ph="form.namePh">
    </label>

    <div class="row2" id="moneyRow">
      <label class="f"><span data-i18n="form.amount"></span>
        <input id="fAmount" type="number" inputmode="decimal" min="0" step="1" placeholder="0">
      </label>
      <label class="f"><span data-i18n="form.cycle"></span>
        <select id="fCycle">
          <option value="monthly" data-i18n="cycle.monthly"></option>
          <option value="yearly" data-i18n="cycle.yearly"></option>
          <option value="quarterly" data-i18n="cycle.quarterly"></option>
          <option value="bimonthly" data-i18n="cycle.bimonthly"></option>
          <option value="weekly" data-i18n="cycle.weekly"></option>
          <option value="once" data-i18n="cycle.once"></option>
        </select>
      </label>
    </div>

    <div class="row2" id="warrantyRow" hidden>
      <label class="f"><span data-i18n="form.bought"></span>
        <input id="fBought" type="date">
      </label>
      <label class="f"><span data-i18n="form.wPeriod"></span>
        <select id="fWMonths">
          <option value="" data-i18n="form.wManual"></option>
          <option value="6" data-i18n="form.w6"></option>
          <option value="12" data-i18n="form.w12"></option>
          <option value="24" data-i18n="form.w24"></option>
          <option value="36" data-i18n="form.w36"></option>
          <option value="60" data-i18n="form.w60"></option>
        </select>
      </label>
    </div>

    <div class="row2">
      <label class="f"><span id="dateLabel"></span>
        <input id="fDate" type="date" required>
      </label>
      <label class="f"><span data-i18n="form.remind"></span>
        <select id="fRemind"></select>
      </label>
    </div>

    <label class="f"><span data-i18n="form.note"></span>
      <input id="fNote" maxlength="80" autocomplete="off" data-i18n-ph="form.notePh">
    </label>

    <div id="proofBox" hidden></div>

    <div class="photo" id="photoRow" hidden>
      <button type="button" class="btn ghost" id="photoBtn"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="form.photo"></span><span class="pro-tag" id="photoPro">PRO</span></button>
      <input id="fPhoto" type="file" accept="image/*" hidden>
      <img id="photoPrev" alt="" hidden>
      <button type="button" class="link" id="photoDel" hidden data-i18n="form.photoDel"></button>
    </div>

    <p class="err" id="formErr" role="alert" hidden></p>

    <div class="sheet-foot">
      <button type="button" class="btn danger" id="delBtn" hidden data-i18n="form.delete"></button>
      <button type="submit" class="btn primary" id="saveBtn" data-i18n="form.save"></button>
    </div>
  </form>
</dialog>

<dialog id="modal" class="sheet"><div id="modalBody"></div></dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="scan.js"></script>
</body>
</html>
